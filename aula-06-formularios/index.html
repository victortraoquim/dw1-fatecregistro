<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>formulários</title>
  </head>
  <body>
    <h1>Formulários no HTML5</h1>
    <form method="GET">
      <label for="nome">Nome:</label><br />
      <!-- Input text -->
      <input
        name="nome"
        type="text"
        itemid="nome"
        type="text"
        id="nome"
        placeholder="Insira seu nome completo...
         "
      /><br />
      <!-- input de email -->
      <label for="email">E-mail:</label><br />
      <input name="email" type="email" placeholder="Insira seu e-mail" /><br />
      <!-- input de senha -->
      <label for="senha">Senha:</label><br />
      <input name="senha" type="password" placeholder="Insira sua senha" />
      <br /><br />
      <!-- BOTÃO DE SUBMETER O FOrMULARIO -->
      <input type="submit" value="Cadastrar" />
      <!-- BOTÃO DE LIMPAR FORMULARIO -->
      <input type="reset" value="Limpar" />
    </form>
    <br /><br />
    <hr />
    <h4>outros inputs</h4>
    <form>
      <label>Quantidade:</label><br />
      <!-- imput de numeros -->
      <input type="number" min="10" /> <br />
      <label>Dta:</label><br />
      <!-- input de numeros -->
      <input type="date" /><br /><br />
      <!-- input de arquivos -->
      <input type="file" /><br /><br />
      <!-- campo de texto longo -->
      <label>Comentarios:</label><br />
      <textarea rows="4" cols="40"></textarea>
      <!-- campo invisivel -->
      <input type="hidden" name="idProduto" value="9" />
      <!-- Caixa de seleção -->
      <label>Cursos:</label><br />
      <select name="cursos">
        <option value="1">Programação</option>
        <option value="2">Design Gráfico</option>
        <option value="2">Música</option>
        <option value="2">Enfermagem</option>
      </select>
    </form>
    <br /><br />
    <hr />
    <h2>Exemplo de formulario completo:</h2>
    <!-- FORMULARIO COMPLETO -->
    <h4>Cadastro do usuário</h4>
    <form action="#" method="POST">
      <fieldset>
        <legend>Dados pessoais:</legend>
        <label for="nome">Nome</label>
        <input
          type="text"
          placeholder="Insira seu nome..."
          id="name
            "
          name="name"
        />
        <label for="nascimento">Data de nascimento:</label>
        <input type="date" />
        <label for="sexo">Sexo:</label>
        <!-- radio buttons -->
        <input type="radio" name="sexo" />Masculino
        <input type="radio" name="sexo" />Feminino
        <input type="radio" name="sexo" />Prefiro não informar 
      </fieldset>
      <fieldset>
        <legend>Dados de endereço:</legend>
        <label for="rua">Rua</label>
        <input type="text">
        <label for="numero">Numero:</label>
        <input type="number">
      </fieldset>
    </form>
  </body>
</html>
