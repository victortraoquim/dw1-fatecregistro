<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inserindo imagens no HTML</title>
</head>
<body>
    <!-- cabeçalho -->
    <header>
        <h1>Galeria de fotos</h1>
    </header>
    <!-- conteudo principal -->
     <main>
        <!-- seçoes -->
         <sectiom>
            <!-- inserindo imagens -->
             <img src="midias/imagem.jpg" alt="foto de uma paisagem">
             
             <img src="https://artpoin.com/wp-content/uploads/2023/02/homem-aranha-fundo-transparente9-1086x1536.png" alt="">
             <!-- SRC- SOUCE- Origem da imagem -->
              <!-- ALT - Texto alternativo da imagem -->
         </sectiom>
        <!-- Quebra de linha -->
         <br><br><br>
         <section>
            <!-- imagens aleaotias de banco de imagens -->
             <img src="https://picsum.photos/id/101/300/200" alt="Imagem aleatoria">
             <img src="https://picsum.photos/id/120/300/200" alt="Imagem aleatoria">
             <img src="https://picsum.photos/id/130/300/200" alt="Imagem aleatoria">
             <img src="https://picsum.photos/id/110/300/200" alt="Imagem aleatoria">
             <img src="https://picsum.photos/id/125/300/200" alt="Imagem aleatoria">
             <img src="https://picsum.photos/id/116/300/200" alt="Imagem aleatoria">
             <img src="https://picsum.photos/id/170/300/200" alt="Imagem aleatoria">
          

         </section>
     </main>
     <hr>
     <!-- rodape -->
      <footer>
        <p>&copy; 2026 - FATEC Registro</p>
      </footer>
</body>
</html>
